name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build ./...

  android:
    name: Android checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Provision CMFA native libraries
        run: |
          curl -fL --retry 3 -o /tmp/cmfa.apk \
            https://github.com/MetaCubeX/ClashMetaForAndroid/releases/download/v2.11.37/cmfa-2.11.37-meta-arm64-v8a-release.apk
          echo "84be4f17a166a966828f1674a5e9a063211e855c6d066d660c72fc7489b053a4  /tmp/cmfa.apk" | sha256sum -c -
          mkdir -p third_party/cmfa-aar/core/src/main/jniLibs/arm64-v8a
          unzip -o -j /tmp/cmfa.apk \
            'lib/arm64-v8a/libclash.so' \
            'lib/arm64-v8a/libbridge.so' \
            -d third_party/cmfa-aar/core/src/main/jniLibs/arm64-v8a
          test -s third_party/cmfa-aar/core/src/main/jniLibs/arm64-v8a/libclash.so
          test -s third_party/cmfa-aar/core/src/main/jniLibs/arm64-v8a/libbridge.so

      - name: Build CMFA AARs
        working-directory: third_party/cmfa-aar
        run: bash gradlew :common:assembleRelease :core:assembleRelease

      - name: Copy CMFA AARs
        run: |
          mkdir -p android/app/libs
          cp third_party/cmfa-aar/core/build/outputs/aar/core-release.aar android/app/libs/cmfa-core-release.aar
          cp third_party/cmfa-aar/common/build/outputs/aar/common-release.aar android/app/libs/cmfa-common-release.aar

      - name: Unit tests, lint, and assemble
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -x :app:buildGoCore

      - name: Verify native libraries in APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -E 'lib/arm64-v8a/(libgbfcore|libclash|libbridge)\.so'
          test "$(unzip -l android/app/build/outputs/apk/debug/app-debug.apk \
            | grep -Ec 'lib/arm64-v8a/(libgbfcore|libclash|libbridge)\.so')" -eq 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbf-cache-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
