mode: rule
log-level: warning
ipv6: false
allow-lan: false
find-process-mode: off

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80]
    TLS:
      ports: [443]
    QUIC:
      ports: [443]

proxies:
  - name: gbf-core
    type: http
    server: 127.0.0.1
    port: 8124

proxy-groups:
  - name: GBF
    type: select
    proxies:
      - gbf-core
      - DIRECT

rules:
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - DOMAIN-SUFFIX,granbluefantasy.jp,GBF
  - DOMAIN-SUFFIX,granbluefantasy.akamaized.net,GBF
  - DOMAIN-SUFFIX,granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN-SUFFIX,gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a1-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a2-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a3-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a4-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a5-granbluefantasy.akamaized.net,GBF
  - DOMAIN,prd-game-a-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a1-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a2-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a3-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a4-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a5-granbluefantasy-steam.akamaized.net,GBF
  - DOMAIN,prd-game-a-gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a1-gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a2-gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a3-gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a4-gbf.akamaized.net,GBF
  - DOMAIN,prd-game-a5-gbf.akamaized.net,GBF
  - DOMAIN-SUFFIX,gbf.game.mbga.jp,GBF
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - MATCH,DIRECT
